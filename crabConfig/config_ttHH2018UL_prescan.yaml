  jobID: "campaign_ttHH2018UL_prescanSlim_v1"
  site: "T3_KR_KNU"
  output_base: "ttHH2018UL_prescanSlim_v1"
  analysis_module: ["modules/noop.py", "MODULES"]
  branch_file: "branches/branch_prescan_slim_2018.txt"
  splitting: "FileBased"
  units_per_job: 1

