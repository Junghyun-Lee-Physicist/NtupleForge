# ==========================================================================
# ttHH -> 4b  |  era 2024  |  NanoAOD v15  |  Data: ParkingHH   [written by hand, 2026-10-06]
# ==========================================================================
# Why (docs/03_DECISIONS.md D-2026-10-06-parkinghh): the 2024 HLT menus record the
# b-tag multijet paths of the ttHH FH trigger OR (4J3T PNet / DeepJet, 6J1T, 6J2T)
# only in the ParkingHH primary dataset; JetMET0/1 (config_ttHH2024_v15_had_Data.yaml)
# hold HLT_PFHT1050 only. The analyzer takes each PD's own paths (tempTTHH D-2026-10-06-A).
#
# Datasets: the MINIv6NANOv15 processing, the same as the JetMET / Muon keys of the
# Data config (era I has two datasets there too). DAS 2026-10-06 (lxplus993,
# script/runlogs/run_das_parkinghh_2024_20261006_144016.log): 8 datasets,
# 2,771 files, 1,913,189,591 events, 4.56 TB; per file 1.1-2.0 GB, 0.44-0.83 M events.
# Not used: the PromptReco and 2024CDEReprocessing processings (other NanoAOD), Run2024A/B.
#
# Settings: those of the Data config (skim 6j20, audit, slimB Data list, FileBased 1
# file per job, 1440 min). Jobs: 2,771 (largest task G 856 < 10,000).
# Output: 6j20 keeps perhaps 30-70 % of these multijet-triggered events (JetMET: 11 %),
# ~0.8-1.0 kB per event after slimB -> about 0.5-1.3 TB (budget D-2026-09-28-volume 10 TB,
# planned 5.16 TB). The first finished jobs give the real numbers (P8 audit n_out, MB).
#
# jobID is its own CRAB work area on purpose: submit_crab.py RESUBMITS every key whose
# project directory exists, so these keys must not be added to the Data config.
# output_base is the Data one: CRAB writes <base>/ParkingHH/<key>/..., next to JetMET
# and Muon, where tempTTHH tools/stage3/make_filelists_v15.py --year 2024 looks.
#
# !! CRAB REFUSES ANY TASK WITH MORE THAN 10,000 JOBS (D-2026-07-27-crab-job-limit).
# ==========================================================================

common:
  jobID: "campaign_ttHH2024_v15_had_ParkingHH_v1"
  site: "T3_KR_KNU"
  output_base: "ttHH2024_v15_had_Data_v1"
  analysis_module: ["modules/noop.py", "MODULES"]
  branch_file: "branches/branch_hadronic_2024_v15_Data.txt"
  splitting: "FileBased"
  units_per_job: 1
  # as the Data config (D-2026-09-28-volume): six jets with stored pT > 20 GeV and |eta| < 2.5
  # (script/forge_skims.py), audit on (script/forge_audit.py)
  skim: "6j20"
  audit: true
  # as the Data config (D-2026-09-30-p7): 1440 min; input copy and AAA fallback are submit_crab.py defaults
  max_runtime: 1440

datasets:
  # --- Data (ParkingHH) --- MINIv6NANOv15. DAS 2026-10-06, files / events:
  #   C 237 / 105,158,321   D 271 / 125,986,310   E 378 / 177,971,586   F 599 / 486,729,639
  #   G 856 / 709,609,093   H 136 / 99,559,443    I 136 / 103,497,248   I_v2 158 / 104,677,951
  ParkingHH_Run2024C-MINIv6NANOv15-v1: "/ParkingHH/Run2024C-MINIv6NANOv15-v1/NANOAOD"
  ParkingHH_Run2024D-MINIv6NANOv15-v1: "/ParkingHH/Run2024D-MINIv6NANOv15-v1/NANOAOD"
  ParkingHH_Run2024E-MINIv6NANOv15-v1: "/ParkingHH/Run2024E-MINIv6NANOv15-v1/NANOAOD"
  ParkingHH_Run2024F-MINIv6NANOv15-v4: "/ParkingHH/Run2024F-MINIv6NANOv15-v4/NANOAOD"
  ParkingHH_Run2024G-MINIv6NANOv15-v3: "/ParkingHH/Run2024G-MINIv6NANOv15-v3/NANOAOD"
  ParkingHH_Run2024H-MINIv6NANOv15-v3: "/ParkingHH/Run2024H-MINIv6NANOv15-v3/NANOAOD"
  ParkingHH_Run2024I-MINIv6NANOv15-v3: "/ParkingHH/Run2024I-MINIv6NANOv15-v3/NANOAOD"
  ParkingHH_Run2024I-MINIv6NANOv15_v2-v2: "/ParkingHH/Run2024I-MINIv6NANOv15_v2-v2/NANOAOD"
